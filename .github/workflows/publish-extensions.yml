name: Publish Extension (OIDC Trusted Publishing)

on:
  workflow_dispatch:
    inputs:
      vsix_url:
        description: "Optional explicit GitHub Release .vsix URL (defaults dynamically to package.json version)"
        required: false
        default: ""
  release:
    types: [published]

jobs:
  publish-vscode-marketplace:
    name: Visual Studio Marketplace (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Zero-Dependency Core, CLI & MCP Tests
        run: npm test
      - name: Download Verified Release VSIX
        env:
          INPUT_VSIX_URL: ${{ inputs.vsix_url }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          DEFAULT_URL="https://github.com/963239327/pasteshield-secret-sanitizer/releases/download/v${PKG_VER}/pasteshield-ai-secret-sanitizer-${PKG_VER}.vsix"
          URL="${INPUT_VSIX_URL:-$DEFAULT_URL}"
          echo "Downloading $URL (target version v${PKG_VER})..."
          curl -fsSL "$URL" -o pasteshield.vsix
          ls -lh pasteshield.vsix
      - name: Publish to VS Code Marketplace via OIDC Trusted Publishing
        run: npx -y @vscode/vsce@latest publish --oidc --skip-duplicate --packagePath pasteshield.vsix

  publish-open-vsx:
    name: Open VSX Registry (Skip if live or OVSX_PAT unset)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Open VSX Version & Publish if Needed
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          INPUT_VSIX_URL: ${{ inputs.vsix_url }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          LIVE_VER=$(curl -fsSL https://open-vsx.org/api/craftleaf-studio/pasteshield-ai-secret-sanitizer | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version||''))")
          echo "Target=$PKG_VER Live=$LIVE_VER"
          if [ "$PKG_VER" = "$LIVE_VER" ]; then
            echo "Open VSX is already at $PKG_VER — skipping duplicate publish."
            exit 0
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT secret is not set in GitHub Actions; skipping Open VSX publish in CI (handled headlessly via sync_storefronts_api.py)."
            exit 0
          fi
          DEFAULT_URL="https://github.com/963239327/pasteshield-secret-sanitizer/releases/download/v${PKG_VER}/pasteshield-ai-secret-sanitizer-${PKG_VER}.vsix"
          URL="${INPUT_VSIX_URL:-$DEFAULT_URL}"
          curl -fsSL "$URL" -o pasteshield.vsix
          npx -y ovsx@latest publish pasteshield.vsix --skip-duplicate
